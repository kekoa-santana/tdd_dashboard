# TDD Dashboard Runtime Configuration
# Update these values each off-season — no code changes needed.

# The season being projected (upcoming/current)
current_season: 2026

# Historical season range used for training and display
train_start_season: 2018
train_end_season: 2025

# Game types included in projections
game_types_in_scope:
  - R   # Regular season
  - P   # Postseason

# Schema version for artifact contracts
schema_version: 1

# Live schedule refresh settings
schedule_refresh_interval_minutes: 10
game_window_start_hour: 11   # ET, earliest MLB game time
game_window_end_hour: 24     # ET, latest game end
